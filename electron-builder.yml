appId: com.join3r.stem
productName: Stem

directories:
  buildResources: build
  # electron-vite owns dist/ (the compiled app); keep packaged artifacts apart.
  output: release

# Where updates come from. At build time this block does two things: it embeds
# resources/app-update.yml into the packaged app (how electron-updater knows
# where to look) and writes latest-linux*.yml beside the artifacts (what it finds
# there). The build itself never uploads — the dist scripts say `--publish never`
# and the release workflow attaches these files to the GitHub Release instead.
# Only the AppImage self-updates; macOS is unsigned (Squirrel refuses unsigned
# apps) and a deb belongs to dpkg, so both get a notify-and-download-yourself
# check against the same releases page (src/desktop/updates.ts).
publish:
  provider: github
  owner: join3r
  repo: stem

# No asar. Several pieces are executed by plain-Node children (spawned with
# ELECTRON_RUN_AS_NODE) that cannot read asar archives at all: pi's dist/cli.js,
# dist/main/recall-mcp-server.js, and the copied pi/stem-mcp-extension.mjs +
# pi/pi-node-shim.mjs runtime assets. pi's module resolution can also walk up
# from its own nested node_modules into the app root's (e.g. shared deps like
# yaml), so partial asarUnpack would be fragile. Shipping unpacked needs zero
# path rewrites anywhere; AppImage's squashfs (and the dmg) make the file-count
# cost irrelevant.
asar: false

# onnxruntime-node ships prebuilt N-API binaries for every platform/arch in one
# package and node:sqlite is built into Electron — there is nothing to rebuild.
npmRebuild: false

# package.json and the pruned production node_modules are always included;
# these patterns select the app files on top of that.
files:
  - dist/**
  - build/icon.png # loaded at runtime via app.getAppPath() (server/index.ts appIcon)
  - RELEASE_NOTES.md # ditto — the "what's new" popup reads it (workspace/release-notes.ts)
  # pdf.js is only used for folder-index text extraction (server/folder-index/pdf.ts),
  # which loads legacy/build/pdf.mjs + its fake-worker import pdf.worker.mjs.
  # The browser builds, rendering assets (cmaps/fonts/wasm/icc), minified
  # variants, and sourcemaps are ~33MB of dead weight per artifact.
  - '!node_modules/pdfjs-dist/{build,web,cmaps,iccs,image_decoders,standard_fonts,types,wasm}/**'
  - '!node_modules/pdfjs-dist/legacy/{web,image_decoders}/**'
  - '!node_modules/pdfjs-dist/legacy/build/*.{map,min.mjs}'
  - '!node_modules/pdfjs-dist/legacy/build/pdf.sandbox*'
  # pdfjs-dist's optional native canvas polyfill (skia) — rendering only; text
  # extraction runs on the DOMMatrix/Path2D stubs in server/folder-index/pdf.ts.
  - '!node_modules/@napi-rs/**'
  # word-extractor (folder-index .doc/.docx extraction, server/folder-index/word.ts)
  # ships whole with its deps (saxes, yauzl, …) — pure JS, a few hundred KB, kept
  # external to the main bundle and resolved from node_modules at runtime.
  # pi-web-access ships a 6MB demo video and a banner in its npm tarball (they are
  # in its `files` list for the npm/GitHub page). pi loads its *.ts sources; the
  # marketing assets are pure weight in every artifact.
  - '!node_modules/pi-web-access/*.{mp4,png}'
  # pi-web-access peer-depends on @earendil-works/pi-ai + pi-tui, so npm installs
  # them (and their SDK trees: anthropic, bedrock, genai, mistral, otel, …) at the
  # top level — ~100MB that is never loaded twice over. pi's extension loader
  # ALIASES both specifiers to its own bundled copies
  # (pi-coding-agent/dist/core/extensions/loader.js), and pi-coding-agent carries
  # its whole dependency tree nested under itself, so nothing ever resolves these
  # top-level duplicates. Kept in the dev tree (npm install stays vanilla), dropped
  # from the artifact.
  - '!node_modules/@earendil-works/{pi-ai,pi-tui}/**'
  - '!node_modules/{@anthropic-ai,@aws,@aws-crypto,@aws-sdk,@smithy}/**'
  - '!node_modules/{@google,@mistralai,@opentelemetry}/**'
  - '!node_modules/{openai,zod,zod-to-json-schema,partial-json,json-schema-to-ts,ts-algebra}/**'
  - '!node_modules/{gaxios,gcp-metadata,google-auth-library,google-logging-utils,json-bigint}/**'
  - '!node_modules/{jwa,jws,ecdsa-sig-formatter,buffer-equal-constant-time,bignumber.js,bowser}/**'
  - '!node_modules/{node-fetch,fetch-blob,formdata-polyfill,node-domexception,data-uri-to-buffer}/**'
  - '!node_modules/{web-streams-polyfill,p-retry,ws,marked,get-east-asian-width}/**'
  # onnxruntime-node ships one fat package covering every platform/arch it supports
  # (~500MB unpacked) and electron-builder copies all of it. The GPU execution
  # providers are never opened: recall/embed-worker.ts passes no `device` to
  # transformers.js, so it asks for the CPU provider and the rest are never
  # dlopen'd. libonnxruntime_providers_cuda.so exists for linux/x64 alone and is
  # 327MB — the whole reason the v0.2.0 x64 AppImage came out at twice the size of
  # the arm64 one (433MB vs 216MB). The per-platform `files` below drop the
  # unreachable arch dirs; the loader only ever resolves
  # bin/napi-v3/${process.platform}/${process.arch}.
  - '!node_modules/onnxruntime-node/bin/napi-v3/*/*/libonnxruntime_providers_*'

mac:
  target: [dmg, zip]
  category: public.app-category.productivity
  # Appended to the top-level `files` (electron-builder merges platform-specific
  # patterns rather than replacing them). Spelled out per platform on purpose:
  # electron-builder's ${platform} macro expands to the *host* (process.platform),
  # so a cross-build would strip the wrong dirs, while ${arch} is the build target
  # and is correct here — `dist:mac` builds x64 and arm64 in one invocation.
  files:
    - '!node_modules/onnxruntime-node/bin/napi-v3/{linux,win32}/**'
    - '!node_modules/onnxruntime-node/bin/napi-v3/darwin/!(${arch})/**'
  # Unsigned for now (no Apple Developer ID) — recipients right-click-open or
  # clear quarantine; notarization is a later follow-up.
  identity: null

linux:
  target: [AppImage, deb]
  executableName: stem
  files: # see the note under `mac`
    - '!node_modules/onnxruntime-node/bin/napi-v3/{darwin,win32}/**'
    - '!node_modules/onnxruntime-node/bin/napi-v3/linux/!(${arch})/**'
  # 1024px source; electron-builder derives the icon size set.
  icon: build/icon.png
  category: Utility
  synopsis: Local AI assistant with Quick Chat overlay and Stem Recall memory
  desktop:
    entry:
      StartupWMClass: Stem

deb:
  # Expose `stem` on PATH so DE keyboard shortcuts can run `stem --quick-chat`
  # (the Wayland summon path — see the single-instance handler in server/index.ts).
  afterInstall: build/deb/after-install.sh
  afterRemove: build/deb/after-remove.sh
