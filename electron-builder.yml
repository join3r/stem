appId: com.join3r.stem
productName: Stem

directories:
  buildResources: build
  # electron-vite owns dist/ (the compiled app); keep packaged artifacts apart.
  output: release

# Where updates come from. At build time this block does two things: it embeds
# resources/app-update.yml into the packaged app (how electron-updater knows
# where to look) and writes latest-linux*.yml / latest-mac.yml beside the
# artifacts (what it finds there). The build itself never uploads — the dist
# scripts say `--publish never` and the release workflow attaches these files to
# the GitHub Release instead. The AppImage self-updates, and so does a mac build
# installed in an Applications folder (Squirrel.Mac, from the zip — the app is
# signed since 2026-09, which Squirrel requires). A deb belongs to dpkg, and a
# mac build run off the dmg has nowhere writable to swap into, so both get a
# notify-and-download-yourself check against the same releases page
# (src/desktop/updates.ts).
publish:
  provider: github
  owner: join3r
  repo: stem

# No asar. Several pieces are executed by plain-Node children (spawned with
# ELECTRON_RUN_AS_NODE) that cannot read asar archives at all: pi's dist/cli.js,
# dist/main/recall-mcp-server.js, and the copied pi/stem-mcp-extension.mjs +
# pi/pi-node-shim.mjs runtime assets. pi's module resolution can also walk up
# from its own nested node_modules into the app root's (e.g. shared deps like
# yaml), so partial asarUnpack would be fragile. Shipping unpacked needs zero
# path rewrites anywhere; AppImage's squashfs (and the dmg) make the file-count
# cost irrelevant.
asar: false

# onnxruntime-node ships prebuilt N-API binaries for every platform/arch in one
# package and node:sqlite is built into Electron — there is nothing to rebuild.
npmRebuild: false

# package.json and the pruned production node_modules are always included;
# these patterns select the app files on top of that.
files:
  - dist/**
  - build/icon.png # loaded at runtime via app.getAppPath() (server/index.ts appIcon)
  - RELEASE_NOTES.md # ditto — the "what's new" popup reads it (workspace/release-notes.ts)
  - themes/** # ditto — the themes shipped with the app (desktop/themes.ts bundledThemesDir)
  # pdf.js is only used for folder-index text extraction (server/folder-index/pdf.ts),
  # which loads legacy/build/pdf.mjs + its fake-worker import pdf.worker.mjs.
  # The browser builds, rendering assets (cmaps/fonts/wasm/icc), minified
  # variants, and sourcemaps are ~33MB of dead weight per artifact.
  - '!node_modules/pdfjs-dist/{build,web,cmaps,iccs,image_decoders,standard_fonts,types,wasm}/**'
  - '!node_modules/pdfjs-dist/legacy/{web,image_decoders}/**'
  - '!node_modules/pdfjs-dist/legacy/build/*.{map,min.mjs}'
  - '!node_modules/pdfjs-dist/legacy/build/pdf.sandbox*'
  # pdfjs-dist's optional native canvas polyfill (skia) — rendering only; text
  # extraction runs on the DOMMatrix/Path2D stubs in server/folder-index/pdf.ts.
  - '!node_modules/@napi-rs/**'
  # word-extractor (folder-index .doc/.docx extraction, server/folder-index/word.ts)
  # ships whole with its deps (saxes, yauzl, …) — pure JS, a few hundred KB, kept
  # external to the main bundle and resolved from node_modules at runtime.
  # pi-web-access ships a 6MB demo video and a banner in its npm tarball (they are
  # in its `files` list for the npm/GitHub page). pi loads its *.ts sources; the
  # marketing assets are pure weight in every artifact.
  - '!node_modules/pi-web-access/*.{mp4,png}'
  # transformers.js (the recall embedder, server/recall/embed-worker.ts) resolves
  # through its `node` export to dist/transformers.node.mjs, a webpack build in
  # which `onnxruntime-web` is an ignored module — only onnxruntime-node and
  # onnxruntime-common are ever loaded. The browser package (91MB: WebGL/WebGPU
  # bundles + wasm) and the browser/min/sourcemap variants of transformers' own
  # dist (48MB, incl. a second copy of the 21MB JSEP wasm) are dead in Node.
  - '!node_modules/onnxruntime-web/**'
  - '!node_modules/@huggingface/transformers/dist/*.map'
  - '!node_modules/@huggingface/transformers/dist/*.min.*'
  - '!node_modules/@huggingface/transformers/dist/transformers.js'
  - '!node_modules/@huggingface/transformers/dist/transformers.web.js'
  - '!node_modules/@huggingface/transformers/dist/ort-wasm-*'
  # NOTE: never exclude pi's dependency tree here (@earendil-works/pi-ai, pi-tui,
  # the provider SDKs it carries: anthropic, aws, google, mistral, openai, …).
  # electron-builder 26 does not copy node_modules as laid out on disk: its
  # collector walks the production graph (peer-only installs such as the
  # top-level pi-ai/pi-tui that pi-web-access pulls in are not part of it) and
  # RE-HOISTS everything it can, so pi-coding-agent's nested copies land at
  # node_modules/@earendil-works/pi-ai in the artifact. A `!node_modules/...`
  # pattern on that path deleted pi's only copy — every Linux AppImage/deb up to
  # 0.5.0 failed sign-in with "Cannot find package '@earendil-works/pi-ai'"
  # (GitHub issue #12). The duplicate SDK trees the old exclusions were meant
  # to drop are already deduped by the collector; nothing here saves size.
  # onnxruntime-node's unreachable platform/arch binaries are removed after the
  # copy by scripts/prune-onnxruntime.mjs (afterPack below). The GPU execution
  # providers are never opened either: recall/embed-worker.ts passes no `device`
  # to transformers.js, so it asks for the CPU provider and the rest are never
  # dlopen'd. libonnxruntime_providers_cuda.so exists for linux/x64 alone and is
  # 327MB — the whole reason the v0.2.0 x64 AppImage came out at twice the size
  # of the arm64 one (433MB vs 216MB).
  - '!node_modules/onnxruntime-node/bin/napi-v6/*/*/libonnxruntime_providers_*'

# NEVER add a platform-specific `files:` list under mac:/linux:. Top-level
# `files` is normalised into one filter object; a platform list stays a plain
# array of strings and becomes a second matcher, and a matcher holding only
# `!…` patterns gets `**/*` prepended — every release up to 0.5.1 carried the
# whole repository (src/, tests/, mobile/, docs/, Dockerfile, …) inside the app
# because of two such lists. Target-specific trimming lives in the hook instead.
afterPack: scripts/prune-onnxruntime.mjs
# Compiles native/mac/stem-computer (the computer-control persona's Swift
# helper) before the mac app is packed; a no-op on every other platform.
beforePack: scripts/build-mac-helper.mjs

mac:
  target: [dmg, zip]
  category: public.app-category.productivity
  # Signed with the Awantech Developer ID and notarized (both required for the
  # macOS permission grants — Screen Recording, Accessibility, Input Monitoring —
  # that the computer-control persona needs to survive a rebuild: TCC keys them
  # off a stable signing identity). electron-builder finds the "Developer ID
  # Application" identity in the keychain (or CSC_LINK/CSC_KEY_PASSWORD on CI);
  # notarization reads APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER. With
  # no identity available the build falls back to unsigned, exactly as before.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  extendInfo:
    NSScreenCaptureUsageDescription: Stem captures the screen so a computer-control persona can see what it is doing.
    NSMicrophoneUsageDescription: Stem listens to the microphone while you dictate a message.
    NSSpeechRecognitionUsageDescription: Stem turns your dictation into text on this Mac.
  # The helper is a Mach-O under Resources; electron-builder signs every binary
  # it finds in the bundle, so it gets the same identity and hardened runtime.
  extraResources:
    - from: build/native/stem-computer
      to: bin/stem-computer

linux:
  target: [AppImage, deb]
  executableName: stem
  # 1024px source; electron-builder derives the icon size set.
  icon: build/icon.png
  category: Utility
  synopsis: Local AI assistant with Quick Chat overlay and Stem Recall memory
  desktop:
    entry:
      StartupWMClass: Stem

deb:
  # Expose `stem` on PATH so DE keyboard shortcuts can run `stem --quick-chat`
  # (the Wayland summon path — see the single-instance handler in server/index.ts).
  afterInstall: build/deb/after-install.sh
  afterRemove: build/deb/after-remove.sh
