<!-- Android adaptive-icon foreground: the sprout alone on transparency, at the
     macOS-tile proportion. Android's safe zone is the centre 66% and the sprout
     spans well under half the canvas, so nothing is ever clipped by a launcher
     mask. Background is adaptive-icon-bg.svg. -->
