# Stem on a server: two containers, one socket between them, one bind mount.
#
#   docker compose build
#   docker compose up -d
#
# Everything variable is in `.env` beside this file — see deploy/env.example, and
# docs/running-on-a-server.md for the whole move. Nothing in here is a secret:
# the data key's passphrase appears only as the PATH of a file (see `secrets` at
# the foot), which is the whole point of a Compose secret.

name: stem

services:
  # The server. No ports: the only thing it binds is /run/stem/stem.sock, in a
  # volume shared with caddy. There is nothing here for a port scan to find, and
  # `docker compose ps` shows no published port because there is none.
  stem:
    build:
      context: .
      dockerfile: Dockerfile
    image: stem-server:local
    # A VPS is x86_64 unless it says otherwise. On an arm server (Hetzner CAX,
    # Ampere, a Pi) put STEM_PLATFORM=linux/arm64 in .env — and note that
    # building on the machine that will run it is always the faster path, because
    # anything else goes through QEMU.
    platform: ${STEM_PLATFORM:-linux/amd64}
    restart: unless-stopped
    environment:
      # The name Caddy is reached under, which is the name that arrives in the
      # Host header. Without it every proxied request is refused by the
      # DNS-rebinding check — on a socket there is no port of ours a loopback
      # Host could name, so this list is the whole allowlist.
      STEM_TRUSTED_HOSTS: ${STEM_HOSTNAME:?set STEM_HOSTNAME in .env to the name you reach Stem under, e.g. stem.example.com}
      # Node's own heap ceiling. Recall's embedding worker is a separate process;
      # this is the main one, which holds the chat store and the SSE ring.
      NODE_OPTIONS: ${STEM_NODE_OPTIONS:---max-old-space-size=1024}
      # The clock the assistant and your scheduled tasks reason in. A container
      # is UTC unless told otherwise, and a task set for "every weekday at 9"
      # would run at 9 UTC — the wrong hour for most of the world, silently. Set
      # TZ in .env to your own zone (e.g. Europe/Bratislava).
      TZ: ${TZ:-UTC}
      # Push notifications to the iOS app. Empty on a deployment that has no
      # phone, which switches the feature off entirely (src/server/push/apns.ts)
      # — passing them through costs nothing and keeps the .env the one place
      # where any of this is configured. The .p8 itself has to be mounted in; see
      # deploy/env.example, which is also where these are explained.
      STEM_APNS_KEY_PATH: ${STEM_APNS_KEY_PATH:-}
      STEM_APNS_KEY_ID: ${STEM_APNS_KEY_ID:-}
      STEM_APNS_TEAM_ID: ${STEM_APNS_TEAM_ID:-}
      STEM_APNS_BUNDLE_ID: ${STEM_APNS_BUNDLE_ID:-}
      STEM_APNS_ENV: ${STEM_APNS_ENV:-}
    volumes:
      # THE state root: chats, memory, skills, Files, settings, credentials.
      # A bind mount rather than a named volume so it is a directory on the host
      # that you can back up, rsync, and look at without docker.
      - ${STEM_STATE_ROOT:-./state}:/var/lib/stem/state
      # ~1.4 GB of embedding weights, in a named volume rather than a layer.
      #
      # A layer would put them in every `docker save`, every registry push and
      # every rebuild — for files that are byte-identical for every Stem user and
      # that HuggingFace will hand back on demand. They are also not versioned
      # with the app: changing the model in Settings downloads a different one at
      # runtime whatever is baked in, so a warmed layer would be a gigabyte that
      # goes stale. A volume survives `docker compose down`, image upgrades and
      # container recreation, which is every case that matters.
      #
      # Not in the state root either (it would default there), so a backup of the
      # bind mount above stays small — the same call export/import already made.
      - stem-models:/var/lib/stem/models
      # What `uvx` and `npx` download in order to run a tool: the packages behind
      # your stdio MCP servers, and uv's own CPython. Kept in a volume so an
      # upgrade — which replaces the container — does not make every MCP server
      # re-download its world on the first call after it. Its bin/ is on the
      # PATH, so a tool installed for keeps (`uv tool install`, a static binary)
      # also survives upgrades — unlike an `apt-get install` into the container.
      # Disposable all the same: delete the volume and the next call fetches
      # everything again, and an installed tool is one `uv tool install` away.
      - stem-cache:/var/lib/stem/cache
      # The socket lives here, and caddy mounts the same volume.
      - stem-socket:/run/stem
    secrets:
      - stem_key

  # Ollama, for memory search — OFF unless you ask for it.
  #
  #   COMPOSE_PROFILES=ollama          in .env, then the usual `docker compose up -d`
  #   docker compose exec ollama ollama pull qwen3-embedding:4b
  #
  # Then Settings → Memory → Embeddings: base URL `http://ollama:11434`, model
  # `qwen3-embedding:4b`. That URL is the only thing that changes when the Stem
  # that used to run on your laptop — where the same server was on localhost —
  # becomes this one.
  #
  # A container of its own rather than a second daemon inside the Stem image:
  # the weights are a volume nobody has to rebuild, an Ollama upgrade is
  # `docker compose pull ollama` and touches nothing of Stem's, and a model that
  # eats the box takes down one container instead of the assistant with it.
  #
  # The profile is why this costs nothing to leave here. A deployment that never
  # sets COMPOSE_PROFILES does not pull the image, does not start the container
  # and is byte-for-byte the two-container deployment it was — and Stem does not
  # depend on this service in any sense: an embeddings endpoint that does not
  # answer degrades fact selection to lexical/recency, it does not fail a turn.
  # So there is no `depends_on` here and no ordering to get right.
  #
  # Nothing in Stem *needs* this. The bundled embedder (Settings → Memory,
  # "local") runs in Stem's own process, needs no container and no port; this is
  # for the case where you have measured a bigger model to be better on your own
  # facts, in your own languages.
  ollama:
    profiles: ['ollama']
    # `latest` because a wrong pin is a failed pull, and there is no lock file
    # here to tell you which version you were happy with. Once you know: put
    # STEM_OLLAMA_TAG=<version> in .env. `docker compose pull ollama` is what
    # moves it either way — `up -d` alone will not replace an image you have.
    image: ollama/ollama:${STEM_OLLAMA_TAG:-latest}
    platform: ${STEM_PLATFORM:-linux/amd64}
    restart: unless-stopped
    # No `ports:`, exactly as with stem. 11434 is published to the compose
    # network and nowhere else, which is what makes `http://ollama:11434` safe to
    # leave unauthenticated: Ollama has no concept of a key, and an 11434 open to
    # the internet is somebody else's GPU bill.
    environment:
      TZ: ${TZ:-UTC}
      # Memory, not speed: a VPS runs models on the CPU, and the failure that
      # matters on a small box is not "slow" but "the kernel killed something" —
      # one model resident.
      OLLAMA_MAX_LOADED_MODELS: '1'
      # Two request slots, not one, and this one IS speed: an embedding backfill
      # batch runs a minute-plus on CPU, and with a single slot a chat turn's
      # tiny query embed queues behind it past its 30s budget — surfacing as the
      # "embeddings failed" banner for as long as the backfill runs. A second
      # slot lets the query slip past; the cost is one more context allocation
      # (a few hundred MB for an embedding model), not a second model. Set
      # STEM_OLLAMA_NUM_PARALLEL=1 in .env on a box where that allocation is
      # the difference between running and OOM.
      OLLAMA_NUM_PARALLEL: ${STEM_OLLAMA_NUM_PARALLEL:-2}
      # How long a model stays resident after the last call. Ollama's default is
      # 5m, which for fact ranking means most turns pay a cold load — the calls
      # come minutes apart, not seconds. Raise it (`24h`, or `-1` for "never
      # unload") on a box with the RAM to keep a 4b model parked; leave it on a
      # box that has other work to do.
      OLLAMA_KEEP_ALIVE: ${STEM_OLLAMA_KEEP_ALIVE:-5m}
    volumes:
      # The weights, and the only reason this container has state at all. A
      # named volume for the same reason stem-models is one: several GB that
      # ollama.com will hand back on demand, that no backup should be carrying,
      # and that must survive `docker compose up -d` after an upgrade.
      - ollama-models:/root/.ollama
    # If the box is tight, cap it rather than letting it race Stem for the last
    # of the RAM — the container is then OOM-killed and restarted on its own,
    # instead of the kernel picking a victim:
    #
    #   mem_limit: 4g

  # The front door. TLS, rate limits, access log — see deploy/Caddyfile.
  caddy:
    build:
      context: ./deploy
      dockerfile: Dockerfile.caddy
    image: stem-caddy:local
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      # HTTP/3. Harmless if your provider's firewall drops it.
      - '443:443/udp'
    environment:
      # A bare hostname makes Caddy get and renew a certificate by itself. Port
      # 80 must be reachable from the internet for that, which is why it is
      # published above even though nothing is served on it.
      STEM_SITE_ADDRESS: ${STEM_HOSTNAME:?set STEM_HOSTNAME in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - stem-socket:/run/stem
      # Certificates and ACME account keys. Losing this volume means re-issuing
      # every certificate, which Let's Encrypt rate-limits — keep it.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - stem

secrets:
  # The passphrase that opens this Stem's MCP credentials — the same one the
  # archive was exported under. Compose mounts the FILE at /run/secrets/stem_key
  # inside the container; what is written here is a path on the host and never a
  # value, which is why this file is safe to commit and `.env` is not.
  stem_key:
    file: ${STEM_KEY_FILE:-./stem_key}

volumes:
  stem-models:
  stem-cache:
  # Only created when the ollama profile is on; `docker compose down -v` removes
  # it with the rest, and the next `ollama pull` fetches the weights again.
  ollama-models:
  stem-socket:
  caddy-data:
  caddy-config:
