name: Release

# Tag a version (e.g. `git tag v0.2.0 && git push --tags`) to build and attach
# installers to a GitHub Release. Linux artifacts MUST build on a Linux runner:
# per-platform optional deps (@img/sharp) only install natively.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run dist:linux
      # The artifact tree is what electron-builder's module collector produced, not
      # a copy of node_modules — issue #12 shipped an AppImage whose pi could not
      # import its own dependencies. Load the packaged pi with plain node before
      # the tree is sealed into the AppImage.
      - name: Packaged pi resolves its dependencies
        run: node release/linux*-unpacked/resources/app/node_modules/@earendil-works/pi-coding-agent/dist/cli.js --version
      # latest-linux.yml is the AppImage's update feed: a running Stem polls it
      # on this release to learn a newer one exists (src/desktop/updates.ts).
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            release/*.AppImage
            release/*.deb
            release/latest-linux.yml

  # Best-effort arm64 lane (native arm runner, so optional deps install natively).
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run dist:linux -- --arm64
      # The artifact tree is what electron-builder's module collector produced, not
      # a copy of node_modules — issue #12 shipped an AppImage whose pi could not
      # import its own dependencies. Load the packaged pi with plain node before
      # the tree is sealed into the AppImage.
      - name: Packaged pi resolves its dependencies
        run: node release/linux*-unpacked/resources/app/node_modules/@earendil-works/pi-coding-agent/dist/cli.js --version
      # An arm64 build writes latest-linux-arm64.yml — same feed, per-arch name,
      # so the two lanes never collide on one file.
      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: |
            release/*.AppImage
            release/*.deb
            release/latest-linux-arm64.yml

  mac:
    runs-on: macos-latest
    env:
      # Unsigned build (identity: null in electron-builder.yml); don't hunt for certs.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run dist:mac -- --arm64 --x64
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            release/*.dmg
            release/*.zip

  publish:
    needs: [linux-x64, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: false
          generate_release_notes: true
