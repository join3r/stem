name: Release

# Tag a version (e.g. `git tag v0.2.0 && git push --tags`) to build and attach
# installers to a GitHub Release. Linux artifacts MUST build on a Linux runner:
# per-platform optional deps (@img/sharp) only install natively.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run dist:linux
      # The artifact tree is what electron-builder's matchers and module collector
      # produced, not a copy of the checkout — issue #12 shipped an AppImage whose
      # pi could not import its own dependencies, and every release up to 0.5.1
      # carried the repository's src/ and tests/ (see the NEVER note in
      # electron-builder.yml). Check both before the tree is sealed into the AppImage.
      - name: Packaged app is sound
        run: |
          app=$(echo release/linux*-unpacked/resources/app)
          node "$app/node_modules/@earendil-works/pi-coding-agent/dist/cli.js" --version
          for stray in src tests ios docs scripts Dockerfile; do
            if [ -e "$app/$stray" ]; then echo "::error::$stray/ leaked into the packaged app"; exit 1; fi
          done
          ls "$app/node_modules/onnxruntime-node/bin/napi-v3"
      # latest-linux.yml is the AppImage's update feed: a running Stem polls it
      # on this release to learn a newer one exists (src/desktop/updates.ts).
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            release/*.AppImage
            release/*.deb
            release/latest-linux.yml

  # Best-effort arm64 lane (native arm runner, so optional deps install natively).
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run dist:linux -- --arm64
      # The artifact tree is what electron-builder's matchers and module collector
      # produced, not a copy of the checkout — issue #12 shipped an AppImage whose
      # pi could not import its own dependencies, and every release up to 0.5.1
      # carried the repository's src/ and tests/ (see the NEVER note in
      # electron-builder.yml). Check both before the tree is sealed into the AppImage.
      - name: Packaged app is sound
        run: |
          app=$(echo release/linux*-unpacked/resources/app)
          node "$app/node_modules/@earendil-works/pi-coding-agent/dist/cli.js" --version
          for stray in src tests ios docs scripts Dockerfile; do
            if [ -e "$app/$stray" ]; then echo "::error::$stray/ leaked into the packaged app"; exit 1; fi
          done
          ls "$app/node_modules/onnxruntime-node/bin/napi-v3"
      # An arm64 build writes latest-linux-arm64.yml — same feed, per-arch name,
      # so the two lanes never collide on one file.
      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: |
            release/*.AppImage
            release/*.deb
            release/latest-linux-arm64.yml

  mac:
    # Standard Apple Silicon runner; release only arm64 installers.
    runs-on: macos-15
    env:
      # Release builds require signing and notarization. CSC_LINK is the base64 .p12 of the
      # "Developer ID Application" certificate; APPLE_API_KEY is the .p8 of an
      # App Store Connect key (written to disk below), the other two its ids.
      CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      CSC_NAME: 'Awantech s.r.o. (AX23G9CAL9)'
    steps:
      - name: Require Apple Silicon and release credentials
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          test "$(uname -m)" = arm64
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_API_KEY_P8; do
            if [ -z "${!name}" ]; then echo "::error::Missing release credential: $name"; exit 1; fi
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Write the notarization key
        run: |
          umask 077
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      # Sign while electron-builder's temporary signing keychain is available.
      - run: npm run dist:mac -- --arm64 --config.forceCodeSigning=true --config.dmg.sign=true
      - name: Verify signed and notarized app
        run: |
          app=release/mac-arm64/Stem.app
          test "$(lipo -archs "$app/Contents/MacOS/Stem")" = arm64
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"
      - name: Notarize and verify final DMG
        run: bash scripts/notarize-mac-dmg.sh release/*-arm64.dmg
      # Stapling changed the DMG bytes after electron-builder wrote the feed;
      # re-hash so latest-mac.yml describes the files actually published.
      - name: Refresh the update feed
        run: node scripts/refresh-mac-update-feed.mjs release/latest-mac.yml
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          if-no-files-found: error
          # latest-mac.yml + the zip (and its blockmap, for differential
          # downloads) are what a mac install in /Applications updates from
          # (src/desktop/updates.ts). The zip is untouched by stapling, so its
          # blockmap stays valid; the DMG's does not and is left out.
          path: |
            release/*-arm64.dmg
            release/*-arm64-mac.zip
            release/*-arm64-mac.zip.blockmap
            release/latest-mac.yml
      - name: Remove temporary notarization key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

  publish:
    needs: [linux-x64, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: false
          generate_release_notes: true
