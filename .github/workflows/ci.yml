name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS is the regression gate (behavior there must stay byte-identical);
        # ubuntu proves the Linux port continuously. The Playwright E2E layer
        # launches a headed Electron window — no xvfb needed on macOS, wrapped
        # in xvfb-run on Linux.
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # node:sqlite (used by the recall store) is available flag-free on 24+.
          node-version: '24'
          cache: npm

      - run: npm ci

      # Ubuntu 24.04 runners restrict unprivileged user namespaces (AppArmor),
      # which breaks Electron's sandbox when launched from node_modules.
      - name: Allow Electron sandbox (Linux)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm test

      # The headless boundary, checked by booting it rather than by reading it.
      # `src/server` must not import Electron by any route, and the ESLint rule in
      # the lint step above only sees import specifiers — a transitive `electron`
      # import through a barrel file satisfies it and still resolves at runtime.
      # It does not slip past a process that has no `electron` module to resolve,
      # which is what scripts/server-boot.mjs arranges: it copies the build into a
      # throwaway directory with no node_modules, starts dist/main/server.js there
      # with plain `node`, and exercises the transport against it. It builds first
      # when dist/ is absent, which is why this needs no build step of its own —
      # the same command works from a fresh clone locally. Runs before the E2E
      # step so a broken split fails in seconds rather than after the suite.
      - name: Headless server boots under plain node
        run: npm run test:server

      # tests/e2e/browser-live.spec.ts drives a real Chromium with the Stem
      # extension through the native host — the one check of the per-platform
      # browser-control glue. It skips itself when no browser is installed.
      - name: Install Chromium for the browser-control E2E
        run: npx playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium

      - name: E2E tests (Playwright + Electron)
        run: ${{ runner.os == 'Linux' && 'xvfb-run --auto-servernum --' || '' }} npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: playwright-report/
          retention-days: 7

  # Windows is where run_command now has the most new behaviour, and the part that
  # matters most — telling Git for Windows' bash.exe from WSL's launcher — is only
  # real against a real filesystem: System32\bash.exe exists on these runners.
  #
  # A SUBSET of the unit suite (npm run test:win), not `npm test`. The rest of the
  # suite asserts POSIX facts on purpose — 0600 file modes, Unix-socket binding,
  # a login shell to probe — and those assertions are about the platforms Stem
  # ships to, not bugs to be fixed for Windows' benefit. Running the lot here
  # would report ~30 red tests that say nothing about this code. Widening the
  # list is welcome; making the whole suite host-agnostic is its own project.
  unit-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (Vitest, Windows-relevant subset)
        run: npm run test:win

  # The fact and skill gates compare a quantized model's score against a fixed
  # floor, and that score has moved before without the weights changing: with a
  # runtime upgrade, and between platforms (src/server/recall/gate-canary.ts).
  # This scores a small set of synthetic pairs with the released model and
  # compares them with the scores recorded where the floors were measured.
  #
  # Not required to pass. A hosted Linux runner may have a CPU whose kernels
  # differ from the server the reference was taken on, and that reads as drift
  # with nothing changed in the repo. What it is for: the job going from green
  # to red in the pull request that upgrades transformers.js or onnxruntime.
  gate-canary:
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # 342 MB, pinned by revision and checksum in gte-model-artifact.ts.
      - uses: actions/cache@v4
        with:
          path: .embed-smoke-cache
          key: gate-model-${{ hashFiles('src/server/recall/gte-model-artifact.ts') }}

      - name: Gate model scores as when its floors were measured
        run: npm run eval:gate-canary

  relay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum
      - run: go vet ./...
      - run: go test ./...
