name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS is the regression gate (behavior there must stay byte-identical);
        # ubuntu proves the Linux port continuously. The Playwright E2E layer
        # launches a headed Electron window — no xvfb needed on macOS, wrapped
        # in xvfb-run on Linux.
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # node:sqlite (used by the recall store) is available flag-free on 24+.
          node-version: '24'
          cache: npm

      - run: npm ci

      # Ubuntu 24.04 runners restrict unprivileged user namespaces (AppArmor),
      # which breaks Electron's sandbox when launched from node_modules.
      - name: Allow Electron sandbox (Linux)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm test

      # The headless boundary, checked by booting it rather than by reading it.
      # `src/server` must not import Electron by any route, and the ESLint rule in
      # the lint step above only sees import specifiers — a transitive `electron`
      # import through a barrel file satisfies it and still resolves at runtime.
      # It does not slip past a process that has no `electron` module to resolve,
      # which is what scripts/server-boot.mjs arranges: it copies the build into a
      # throwaway directory with no node_modules, starts dist/main/server.js there
      # with plain `node`, and exercises the transport against it. It builds first
      # when dist/ is absent, which is why this needs no build step of its own —
      # the same command works from a fresh clone locally. Runs before the E2E
      # step so a broken split fails in seconds rather than after the suite.
      - name: Headless server boots under plain node
        run: npm run test:server

      - name: E2E tests (Playwright + Electron)
        run: ${{ runner.os == 'Linux' && 'xvfb-run --auto-servernum --' || '' }} npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: playwright-report/
          retention-days: 7

  # Windows is where run_command now has the most new behaviour, and the part
  # that matters most — telling Git for Windows' bash.exe from WSL's launcher —
  # is only real against a real filesystem: System32\bash.exe exists on these
  # runners. Unit tests only; the E2E and headless-boot layers stay on the matrix
  # above, where the app is actually shipped from.
  unit-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm test
